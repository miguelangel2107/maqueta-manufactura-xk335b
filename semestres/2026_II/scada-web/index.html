<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCADA XL-335B</title>
  <meta name="description" content="SCADA web de la celda de manufactura XL-335B: supervisión y mando por Modbus RTU desde el navegador (Web Serial).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7d76'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,Arial' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EXL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/scada.css">
  <script>
    // Tema antes de pintar para evitar un destello
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('xl335b.settings') || '{}');
        var t = s.theme || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <noscript>Este SCADA necesita JavaScript.</noscript>
  <script src="js/core.js"></script>
  <script src="js/modbus.js"></script>
  <script src="js/model.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
